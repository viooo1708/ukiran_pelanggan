name: ukiran_pelanggan
description: Aplikasi pelanggan untuk pemesanan produk kriya ukir Adi Ukiran.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  font_awesome_flutter: ^10.0.0
  
  # Cupertino Icons
  cupertino_icons: ^1.0.8
  
  # State management
  provider: ^6.1.2
  
  # Networking
  http: ^1.2.1
  
  # Local storage (menyimpan token & data user login)
  shared_preferences: ^2.5.3
  
  # Format tanggal & mata uang (Rupiah)
  intl: ^0.19.0
  
  # Menampilkan gambar produk / foto profil dari URL
  cached_network_image: ^3.3.1
  
  # Memilih foto profil dari galeri/kamera
  image_picker: ^1.1.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: "^0.13.1"

flutter:
  uses-material-design: true

  assets:
    - assets/logo-ukir.png

# Konfigurasi Icon Aplikasi (Diletakkan di paling bawah)
flutter_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/logo-ukir.png"